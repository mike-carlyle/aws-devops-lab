services:
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    mem_limit: 2g
    memswap_limit: 2g
    pids_limit: 512
    container_name: open-webui
    restart: unless-stopped
    # Chat UI in front of Ollama. Reaches the API over the shared ollama_default
    # network as http://ollama:11434 (no auth needed internally). Open WebUI has
    # its OWN login (first user to register becomes admin), so it is safe to
    # publish on the LAN + tailnet directly — no Caddy basic-auth needed.
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - TZ=Europe/London
      - WEBUI_AUTH=true
      # Hardened 2026-07-06: stable signing key from .env (0600) so login sessions
      # survive container recreates instead of a fresh random key each start.
      - WEBUI_SECRET_KEY=${WEBUI_SECRET_KEY}
    security_opt:
      - no-new-privileges:true
    ports:
      # Hardened 2026-07-06: was "3002:8080" (all interfaces / LAN-reachable).
      # Bind to tailnet + loopback only; reach via Tailscale or the tailnet-only Caddy.
      # 2026-08-14: tailnet address is no longer hardcoded -- TAILNET_IP is kept
      # current in .env by ~/.local/bin/sync-tailnet-ip.sh (cron: @reboot, */15).
      - "127.0.0.1:3002:8080"
      - "${TAILNET_IP}:3002:8080"
    volumes:
      - ./data:/app/backend/data   # accounts, chat history, settings persist here
    networks:
      - default
      - ollama-net
    labels:
      - com.centurylinklabs.watchtower.enable=true

networks:
  ollama-net:
    external: true
    name: ollama_default
