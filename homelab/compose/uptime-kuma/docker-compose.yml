services:
  uptime-kuma:
    # Upgraded v1 -> v2 on 2026-07-06 (one-way DB migration on first boot).
    # Full pre-upgrade backup: kuma-data-backup-v1.23.17-*.tar.gz in this dir.
    image: louislam/uptime-kuma:2
    mem_limit: 512m
    memswap_limit: 512m
    pids_limit: 256
    container_name: uptime-kuma
    restart: unless-stopped
    # Host network mode so probes against host-network-bound services
    # (Jellyfin, SSH, Minecraft) appear as host-originated and match
    # the existing LAN/Tailscale UFW allow rules.
    network_mode: host
    # Explicit resolvers (2026-08-28). With network_mode: host, Docker COPIES the
    # host's /etc/resolv.conf at container start and never refreshes it. At boot
    # docker.service (09:48:59) and this container (09:49:00) both start BEFORE
    # tailscaled rewrites /etc/resolv.conf for MagicDNS (09:49:08) — so Kuma froze
    # a pre-Tailscale copy and the "Family Calendar" monitor failed every probe
    # with getaddrinfo ENOTFOUND mchomeserver.tail114033.ts.net until manually
    # restarted. Pinning the resolvers here makes resolv.conf independent of that
    # 8-second boot race.
    dns:
      - 100.100.100.100 # Tailscale MagicDNS: resolves *.ts.net, forwards the rest
      - 9.9.9.9         # fallback for public names if tailscaled is down
    volumes:
      - ./data:/app/data
    labels:
      - com.centurylinklabs.watchtower.enable=true
