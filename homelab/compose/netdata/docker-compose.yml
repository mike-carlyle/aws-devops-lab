services:
  netdata:
    image: netdata/netdata:stable
    mem_limit: 1g
    memswap_limit: 1g
    pids_limit: 1024
    container_name: netdata
    hostname: netdata
    ports:
      - 127.0.0.1:19998:19999
    # Hardened 2026-07-06: dropped `apparmor=unconfined` (netdata runs fine under the
    # docker-default AppArmor profile) and the SYS_PTRACE capability, to shrink the
    # post-compromise blast radius. The docker.sock stays read-only (below).
    # If per-process memory charts (apps.plugin) look incomplete, re-add ONLY the
    # capability by uncommenting the two lines below (leave apparmor at default).
    # cap_add:
    #   - SYS_PTRACE
    environment:
      - NETDATA_HOST_PREFIX=/host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /etc/os-release:/host/etc/os-release:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - netdataconfig:/etc/netdata
      - netdatalib:/var/lib/netdata
      - netdatacache:/var/cache/netdata
    restart: unless-stopped
    # Run tini as PID 1 to reap zombie children (healthcheck + spawn-server processes)
    init: true
    labels:
      - com.centurylinklabs.watchtower.enable=true

volumes:
  netdataconfig:
  netdatalib:
  netdatacache:
