services:
  homepage:
    image: ghcr.io/gethomepage/homepage:latest
    mem_limit: 512m
    memswap_limit: 512m
    pids_limit: 256
    container_name: homepage
    restart: unless-stopped
    # Run tini as PID 1 to reap zombie children left by healthcheck (wget) processes
    init: true
    ports:
      # Hardened 2026-07-06: was "3000:3000" (all interfaces / reachable across the LAN).
      # Bind to tailnet + loopback only; reach via Tailscale or the tailnet-only Caddy.
      # 2026-08-14: tailnet address is no longer hardcoded -- TAILNET_IP is kept
      # current in .env by ~/.local/bin/sync-tailnet-ip.sh (cron: @reboot, */15).
      - "127.0.0.1:3000:3000"
      - "${TAILNET_IP}:3000:3000"
    # Hardened 2026-07-06: now runs NON-root. It no longer mounts the raw docker socket
    # (see the homepage-dockerproxy service below), so root is no longer required.
    # ./config is owned by uid 1000 (mike), so 1000:1000 can read/write it.
    user: "1000:1000"
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./config:/app/config
      # Serve custom icons (e.g. /icons/fail2ban.svg) from config/icons
      - ./config/icons:/app/public/icons:ro
      # Hardened 2026-07-06: raw docker.sock mount removed. Homepage now queries the
      # scoped read-only homepage-dockerproxy (TCP 2375) instead of the host root socket.
    environment:
      - TZ=Europe/London
      # CSRF protection — must include every hostname/IP you'll access Homepage from
      # Must track TAILNET_IP too -- a stale entry here means Homepage answers the
      # request and then rejects it as a CSRF failure, which looks like a broken app.
      - HOMEPAGE_ALLOWED_HOSTS=192.168.1.10:3000,mchomeserver:3000,${TAILNET_IP}:3000,localhost:3000
      # Service API credentials — values come from .env (gitignored, mode 0600)
      - HOMEPAGE_VAR_ADGUARD_USERNAME=${HOMEPAGE_VAR_ADGUARD_USERNAME}
      - HOMEPAGE_VAR_ADGUARD_PASSWORD=${HOMEPAGE_VAR_ADGUARD_PASSWORD}
      - HOMEPAGE_VAR_JELLYFIN_API_KEY=${HOMEPAGE_VAR_JELLYFIN_API_KEY}
      - HOMEPAGE_VAR_PORTAINER_TOKEN=${HOMEPAGE_VAR_PORTAINER_TOKEN}
      - HOMEPAGE_VAR_DUPLICATI_PASSWORD=${HOMEPAGE_VAR_DUPLICATI_PASSWORD}
      - HOMEPAGE_VAR_WATCHTOWER_TOKEN=${HOMEPAGE_VAR_WATCHTOWER_TOKEN}
      - HOMEPAGE_VAR_WEATHER_LAT=${HOMEPAGE_VAR_WEATHER_LAT}
      - HOMEPAGE_VAR_WEATHER_LON=${HOMEPAGE_VAR_WEATHER_LON}
    # Attach to Watchtower's internal network so we can query its metrics
    # endpoint at http://watchtower:8080 without exposing it to the host.
    networks:
      - default
      - watchtower-proxy
      - ollama-net
      # portainer-net: so the Portainer widget can reach Portainer's INTERNAL http
      # (http://portainer:9000) over the docker network — no host port exposure needed.
      - portainer-net
    labels:
      - com.centurylinklabs.watchtower.enable=true

  # Hardened 2026-07-06: scoped, read-only Docker API proxy for Homepage's docker
  # widget — mirrors the existing Watchtower socket-proxy. Only GET container/info
  # endpoints are permitted (POST/EXEC/VOLUMES/SECRETS/IMAGES all denied). Homepage
  # reaches it at http://homepage-dockerproxy:2375 instead of mounting the raw socket.
  homepage-dockerproxy:
    image: tecnativa/docker-socket-proxy:latest
    container_name: homepage-dockerproxy
    restart: unless-stopped
    environment:
      - CONTAINERS=1
      - INFO=1
      - VERSION=1
      - PING=1
      - POST=0
      - EXEC=0
      - VOLUMES=0
      - NETWORKS=0
      - SECRETS=0
      - IMAGES=0
      - AUTH=0
      - BUILD=0
      - COMMIT=0
      - CONFIGS=0
      - DISTRIBUTION=0
      - NODES=0
      - PLUGINS=0
      - SERVICES=0
      - SESSION=0
      - SWARM=0
      - SYSTEM=0
      - TASKS=0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - default
    labels:
      - com.centurylinklabs.watchtower.enable=true

networks:
  watchtower-proxy:
    external: true
    name: watchtower_docker-proxy
  ollama-net:
    external: true
    name: ollama_default
  portainer-net:
    external: true
    name: portainer_default
