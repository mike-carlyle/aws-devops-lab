# Homepage docker integration
# Lets services with 'server: my-docker' show live container status (running/stopped, CPU, memory)
# See https://gethomepage.dev/configs/docker/

my-docker:
  # Hardened 2026-07-06: was `socket: /var/run/docker.sock`. Now uses the scoped,
  # read-only homepage-dockerproxy (TCP 2375) — no raw socket mounted into homepage.
  host: homepage-dockerproxy
  port: 2375
