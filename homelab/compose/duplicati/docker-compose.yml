services:
  duplicati:
    image: lscr.io/linuxserver/duplicati:development
    mem_limit: 2g
    memswap_limit: 2g
    pids_limit: 512
#    image: lscr.io/linuxserver/duplicati:latest
    container_name: duplicati
    environment:
      # 2026-09-05: was PUID=1000/PGID=1000. A DR audit found Duplicati had been silently
      # permission-denied on root-owned paths for ~38 consecutive runs -- including
      # /home/mike/adguard/conf/AdGuardHome.yaml, the ENTIRE configuration of the LAN's only
      # DNS server (admin hash, every rewrite, client IDs, filter lists), which had therefore
      # never been backed up even once. /etc/msmtprc (the Gmail app password) was in the same
      # position. Those denials appear only in the nightly warning stream, which had long since
      # been normalised into noise, so nobody noticed.
      #
      # A backup tool cannot back up root-owned config without root read access -- keeping it
      # unprivileged just moves the privilege to whatever process stages the files instead.
      # THE TRADE-OFF, stated plainly: if this container is compromised it can now READ every
      # secret under /etc and /home/mike. That is bounded by three things -- both source mounts
      # are :ro so it cannot write to the host, the UI is bound to loopback + tailnet only
      # (never the LAN) and is password-protected, and no docker socket is mounted.
      #
      # To revert: set these back to 1000 and `docker compose up -d`. AdGuard's config and
      # /etc then silently drop out of the backup again -- check the run warnings if you do.
      - PUID=0
      - PGID=0
      - TZ=Europe/London
      - DUPLICATI__WEBSERVICE_ALLOWED_HOSTNAMES=*
      - DUPLICATI__WEBSERVICE_PASSWORD=${DUPLICATI__WEBSERVICE_PASSWORD}
      - SETTINGS_ENCRYPTION_KEY=${SETTINGS_ENCRYPTION_KEY}
    volumes:
      - /home/mike/duplicati/config:/config
      - /home/mike:/source/home:ro
      - /etc:/source/etc:ro
    ports:
      # Hardened 2026-07-06: was "8200:8200" (all interfaces / reachable across the LAN).
      # This UI can read /etc and /home/mike, so bind it to tailnet + loopback only.
      # 2026-08-14: tailnet address is no longer hardcoded -- TAILNET_IP is kept
      # current in .env by ~/.local/bin/sync-tailnet-ip.sh (cron: @reboot, */15).
      # Reach via Tailscale: http://$TAILNET_IP:8200
      - "${TAILNET_IP}:8200:8200"
      - "127.0.0.1:8200:8200"
    restart: unless-stopped
