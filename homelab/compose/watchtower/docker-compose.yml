services:
  # Hardened Docker socket proxy.
  # Exposes only the subset of the Docker API that Watchtower actually needs,
  # instead of giving Watchtower full RW access to /var/run/docker.sock.
  socket-proxy:
    image: tecnativa/docker-socket-proxy:latest
    mem_limit: 128m
    memswap_limit: 128m
    pids_limit: 64
    container_name: socket-proxy
    restart: unless-stopped
    environment:
      # Endpoints Watchtower needs:
      CONTAINERS: 1   # list and inspect containers
      IMAGES: 1       # pull and inspect images
      POST: 1         # start, stop, restart, recreate containers
      EVENTS: 1       # watch for container lifecycle events
      INFO: 1         # daemon info
      PING: 1         # health check
      VERSION: 1      # API version negotiation
      # Everything else stays at the safe default of 0 (denied):
      # AUTH, BUILD, COMMIT, CONFIGS, DISTRIBUTION, EXEC, GRPC,
      # NETWORKS, NODES, PLUGINS, SECRETS, SERVICES, SESSION,
      # SWARM, SYSTEM, TASKS, VOLUMES
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - docker-proxy
    labels:
      # Deliberately NOT watchtower-managed. Watchtower reaches the Docker API
      # *through* this container: if it stops socket-proxy to update it, it
      # severs its own connection mid-session and cannot recreate anything.
      # That happened 2026-07-27 10:03 and took socket-proxy,
      # homepage-dockerproxy and open-webui down until manually restarted.
      # Update this image by hand: docker compose pull socket-proxy && docker compose up -d
      - com.centurylinklabs.watchtower.enable=false

  watchtower:
    image: nickfedor/watchtower:1.17
    mem_limit: 256m
    memswap_limit: 256m
    pids_limit: 128
    container_name: watchtower
    restart: unless-stopped
    depends_on:
      - socket-proxy
    networks:
      - docker-proxy
    command: >
      --interval 3600
      --cleanup
      --label-enable
    environment:
      - DOCKER_HOST=tcp://socket-proxy:2375
      # Enable Watchtower's HTTP metrics endpoint so Homepage can show
      # live scan/update counts. Reachable internally on docker-proxy
      # network only — no host port exposure. Token is in .env.
      - WATCHTOWER_HTTP_API_METRICS=true
      - WATCHTOWER_HTTP_API_TOKEN=${WATCHTOWER_HTTP_API_TOKEN}
      - WATCHTOWER_NOTIFICATIONS=email
      - WATCHTOWER_NOTIFICATION_EMAIL_FROM=michael.carlyle21@gmail.com
      - WATCHTOWER_NOTIFICATION_EMAIL_TO=michael.carlyle21@gmail.com
      - WATCHTOWER_NOTIFICATION_EMAIL_SERVER=smtp.gmail.com
      - WATCHTOWER_NOTIFICATION_EMAIL_SERVER_PORT=587
      - WATCHTOWER_NOTIFICATION_EMAIL_SERVER_USER=michael.carlyle21@gmail.com
      - WATCHTOWER_NOTIFICATION_EMAIL_SERVER_PASSWORD=${WATCHTOWER_NOTIFICATION_EMAIL_SERVER_PASSWORD}
    labels:
      - com.centurylinklabs.watchtower.enable=true

networks:
  docker-proxy:
    driver: bridge
