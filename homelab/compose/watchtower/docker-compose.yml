services:
  # Hardened Docker socket proxy.
  # Exposes only the subset of the Docker API that Watchtower actually needs,
  # instead of giving Watchtower full RW access to /var/run/docker.sock.
  socket-proxy:
    image: tecnativa/docker-socket-proxy:latest
    mem_limit: 128m
    memswap_limit: 128m
    pids_limit: 64
    container_name: socket-proxy
    restart: unless-stopped
    environment:
      # Endpoints Watchtower needs:
      CONTAINERS: 1   # list and inspect containers
      IMAGES: 1       # pull and inspect images
      POST: 1         # start, stop, restart, recreate containers
      EVENTS: 1       # watch for container lifecycle events
      INFO: 1         # daemon info
      PING: 1         # health check
      VERSION: 1      # API version negotiation
      # Everything else stays at the safe default of 0 (denied):
      # AUTH, BUILD, COMMIT, CONFIGS, DISTRIBUTION, EXEC, GRPC,
      # NETWORKS, NODES, PLUGINS, SECRETS, SERVICES, SESSION,
      # SWARM, SYSTEM, TASKS, VOLUMES
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      # STATIC IP (2026-08-28). Uptime Kuma runs network_mode: host, so it cannot
      # resolve this network's DNS names and must address the proxy by IP. Before
      # this pin the address was whatever IPAM handed out on boot: after the
      # 2026-08-28 kernel reboot socket-proxy and watchtower swapped .2/.3, which
      # broke Kuma's "Minecraft" (docker host tcp://172.18.0.2:2375) and
      # "Watchtower" monitors. .2/.3 sit OUTSIDE the ip_range dynamic pool below,
      # so nothing else on this network can ever take them.
      docker-proxy:
        ipv4_address: 172.18.0.2
    labels:
      # Deliberately NOT watchtower-managed. Watchtower reaches the Docker API
      # *through* this container: if it stops socket-proxy to update it, it
      # severs its own connection mid-session and cannot recreate anything.
      # That happened 2026-07-27 10:03 and took socket-proxy,
      # homepage-dockerproxy and open-webui down until manually restarted.
      # Update this image by hand: docker compose pull socket-proxy && docker compose up -d
      - com.centurylinklabs.watchtower.enable=false

  watchtower:
    image: nickfedor/watchtower:1.17
    mem_limit: 256m
    memswap_limit: 256m
    pids_limit: 128
    container_name: watchtower
    restart: unless-stopped
    depends_on:
      - socket-proxy
    networks:
      # STATIC IP (2026-08-28) — see the note on socket-proxy above. Kuma's
      # "Watchtower" monitor hits http://172.18.0.3:8080/v1/metrics.
      docker-proxy:
        ipv4_address: 172.18.0.3
    command: >
      --interval 3600
      --cleanup
      --label-enable
    environment:
      - DOCKER_HOST=tcp://socket-proxy:2375
      # Enable Watchtower's HTTP metrics endpoint so Homepage can show
      # live scan/update counts. Reachable internally on docker-proxy
      # network only — no host port exposure. Token is in .env.
      - WATCHTOWER_HTTP_API_METRICS=true
      - WATCHTOWER_HTTP_API_TOKEN=${WATCHTOWER_HTTP_API_TOKEN}
      - WATCHTOWER_NOTIFICATIONS=email
      # ⚠ error, NOT the default info/warn. Watchtower reads EVERY container's image config each
      # scan, including ones excluded by --label-enable, and a container still running on an image
      # that has since been deleted makes that read fail at WARN level — once an hour, forever, one
      # email each (2026-08-21: family-calendar's cal-backup/cal-mail, 24 mails a day. Root cause
      # fixed by version-tagging those builds; this is the backstop for the next variant).
      # Update reports still arrive: those are sent off the session report, not the log stream —
      # which is why the noise mails contained ONLY warning lines and no info lines.
      - WATCHTOWER_NOTIFICATIONS_LEVEL=error
      - WATCHTOWER_NOTIFICATION_EMAIL_FROM=michael.carlyle21@gmail.com
      - WATCHTOWER_NOTIFICATION_EMAIL_TO=michael.carlyle21@gmail.com
      - WATCHTOWER_NOTIFICATION_EMAIL_SERVER=smtp.gmail.com
      - WATCHTOWER_NOTIFICATION_EMAIL_SERVER_PORT=587
      - WATCHTOWER_NOTIFICATION_EMAIL_SERVER_USER=michael.carlyle21@gmail.com
      - WATCHTOWER_NOTIFICATION_EMAIL_SERVER_PASSWORD=${WATCHTOWER_NOTIFICATION_EMAIL_SERVER_PASSWORD}
    labels:
      - com.centurylinklabs.watchtower.enable=true

networks:
  docker-proxy:
    driver: bridge
    ipam:
      config:
        # Subnet is declared explicitly (same 172.18.0.0/16 IPAM picked before) because
        # Docker only honours ipv4_address on networks with a USER-configured subnet.
        # ip_range confines dynamic allocation to 172.18.1.0/24, so other members that
        # attach here (e.g. homepage, for its Watchtower widget) get .1.x and can never
        # collide with the .0.2/.0.3 pins above.
        - subnet: 172.18.0.0/16
          gateway: 172.18.0.1
          ip_range: 172.18.1.0/24
