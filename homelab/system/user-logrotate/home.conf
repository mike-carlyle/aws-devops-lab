# User-level logrotate for logs that cron appends to in $HOME (no sudo needed).
# Run daily from mike's crontab; state lives in ~/.local/state/logrotate.status.
# Writers reopen with >> on every run, so plain rotation is safe (no copytruncate).
/home/mike/tailnet-ip-sync.log {
    weekly
    rotate 8
    compress
    delaycompress
    missingok
    notifempty
}

# One line per daily run, so rotate monthly. heartbeat.log and
# weddingdev-nightly-restart.log are NOT listed: their scripts already trim
# themselves with tail, and a second cap would just fight the first.
/home/mike/docker-builder-prune.log {
    monthly
    rotate 12
    compress
    delaycompress
    missingok
    notifempty
}
