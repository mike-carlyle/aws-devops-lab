# Added 2026-08-14.
#
# homepage, open-webui, duplicati and portainer publish their ports to the
# Tailscale address (see sync-tailnet-ip.sh) as well as loopback -- see the "Hardened
# 2026-07-06" comments in each docker-compose.yml. They must NOT be published
# on the LAN.
#
# On boot (and on any tailscaled restart) Docker can try to bind those ports
# before tailscaled has assigned the address to tailscale0. The bind then fails
# with "cannot assign requested address", and restart: unless-stopped gives up
# after its retry budget, leaving the services down until started by hand.
# That is exactly what happened on 2026-08-12: containers retried at 12:49:45,
# tailscaled finished coming up at 12:50:12 -- about 25 seconds too late.
#
# ip_nonlocal_bind lets a socket bind an address that is not currently present
# on any interface, so Docker can claim the tailnet address before tailscale0 exists.
# Traffic still only arrives once Tailscale is actually up. This keeps the
# tailnet+loopback-only bindings exactly as they are; binding 0.0.0.0 instead
# would expose Duplicati (reads /etc and /home/mike) and Portainer (raw docker
# socket) to the whole LAN.
net.ipv4.ip_nonlocal_bind = 1
