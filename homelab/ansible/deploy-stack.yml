---
# Phase 1 — Homelab stack deployment.
#
# What this does:
#   * Ensures each service has its runtime directory under $SERVICE_ROOT
#   * Syncs docker-compose.yml plus any non-secret config files from
#     homelab/compose/<service>/ in the repo to the runtime location,
#     never overwriting a real .env on the host
#   * Brings up services whose .env (if required) is already in place,
#     IN CATALOGUE ORDER (see the note above `services` in group_vars/all.yml)
#   * Reports any services held back because their .env is missing
#
# What this does NOT do (yet):
#   * Install Docker or any host packages
#   * Manage host configs (msmtp, UFW, sshd_config.d, unattended-upgrades)
#   * Manage secrets — .env files stay hand-edited from .env.example
#
# Idempotent: running twice in a row should be a no-op apart from image pulls.

- name: Deploy homelab Docker stack
  hosts: mchomeserver
  gather_facts: false

  tasks:
    # ---------- runtime directory + file sync ----------

    - name: Ensure each service's runtime directory exists
      ansible.builtin.file:
        path: "{{ service_root }}/{{ item.name }}"
        state: directory
        mode: '0755'
      loop: "{{ services }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Sync compose and non-secret configs from repo to runtime
      # rsync handles per-file change detection cleanly. Excluding .env means
      # the host's real .env (containing secrets) is never overwritten by the
      # .env.example tracked in the repo.
      ansible.builtin.command:
        cmd: >
          rsync -a --exclude=.env
          {{ repo_root }}/homelab/compose/{{ item.name }}/
          {{ service_root }}/{{ item.name }}/
      loop: "{{ services }}"
      loop_control:
        label: "{{ item.name }}"
      register: rsync_result
      changed_when: rsync_result.stdout | length > 0

    # ---------- figure out which services are ready to start ----------

    - name: Check if each service has a usable .env on the runtime host
      ansible.builtin.stat:
        path: "{{ service_root }}/{{ item.name }}/.env"
      loop: "{{ services }}"
      loop_control:
        label: "{{ item.name }}"
      register: env_state

    - name: Check if each service ships an .env.example in the repo
      ansible.builtin.stat:
        path: "{{ repo_root }}/homelab/compose/{{ item.name }}/.env.example"
      loop: "{{ services }}"
      loop_control:
        label: "{{ item.name }}"
      register: env_example_state

    - name: Build sets of (needs-env, has-env)
      ansible.builtin.set_fact:
        services_needing_env: "{{ env_example_state.results | selectattr('stat.exists', 'equalto', true) | map(attribute='item.name') | list }}"
        services_with_env: "{{ env_state.results | selectattr('stat.exists', 'equalto', true) | map(attribute='item.name') | list }}"

    # ORDER MATTERS, so this filters the ORDERED `services` list rather than doing
    # arithmetic between two unordered sets. The previous version computed
    # `services_wanting_start | difference(...)`, and Jinja's difference/intersect are
    # SET operations — the resulting order was incidental, so ollama could deploy after
    # open-webui, and homepage before every project that owns the networks it joins.
    # `reject('in', ...)` preserves the order of its left-hand sequence; the set
    # difference below is only used to compute WHICH names to exclude, where order is
    # genuinely irrelevant.
    - name: Compute ready-to-start and held-back lists, preserving catalogue order
      ansible.builtin.set_fact:
        ready_to_start: >-
          {{ services | selectattr('start', 'equalto', true) | map(attribute='name')
             | reject('in', services_needing_env | difference(services_with_env)) | list }}
        held_back: >-
          {{ services | selectattr('start', 'equalto', true) | map(attribute='name')
             | select('in', services_needing_env | difference(services_with_env)) | list }}

    # ---------- cross-repo dependency that ordering cannot fix ----------

    # homepage joins family-calendar_cal-internal as an external network, and that
    # network is created by the family-calendar project, which lives in a DIFFERENT
    # repository. On a rebuilt host it will not exist until that stack is deployed, and
    # docker compose fails with a bare "network not found" that gives no hint why.
    # Say so plainly instead. Not a hard failure: everything else still deploys.
    - name: Check whether the family-calendar network exists (homepage depends on it)
      ansible.builtin.command:
        cmd: docker network inspect family-calendar_cal-internal
      register: cal_net
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Warn that homepage cannot start until the family-calendar stack is deployed
      ansible.builtin.debug:
        msg:
          - "The docker network 'family-calendar_cal-internal' does not exist."
          - "It is owned by the family-calendar project, which is a SEPARATE repo."
          - "homepage joins it as an external network and will fail to start until"
          - "that stack has been deployed at least once. Everything else is unaffected."
      when: cal_net.rc != 0

    # ---------- bring up services that are ready ----------

    # AdGuard is deployed on its own, first, and WITHOUT failure tolerance. It is the
    # LAN's only DNS: if it will not come up, that is not a partial deploy to be
    # summarised at the end, it is a house-wide outage and the play should stop on it.
    - name: Deploy AdGuard first — the LAN's only DNS, and a hard dependency
      community.docker.docker_compose_v2:
        project_src: "{{ service_root }}/adguard"
        state: present
        pull: missing
      when: "'adguard' in ready_to_start"

    # Everything else tolerates a single failure so that one broken service does not
    # prevent the remaining ones deploying — the old behaviour, where a failing
    # homepage aborted the play, left every later service undeployed. The play still
    # FAILS at the end, so a partial deploy is never mistaken for a good one.
    - name: Deploy the remaining ready services, in catalogue order
      community.docker.docker_compose_v2:
        project_src: "{{ service_root }}/{{ item }}"
        state: present
        pull: missing
      loop: "{{ ready_to_start | reject('equalto', 'adguard') | list }}"
      register: deploy_results
      ignore_errors: true

    - name: Report on services held back due to missing .env
      ansible.builtin.debug:
        msg:
          - "These services are configured to start but their .env file is missing:"
          - "  {{ held_back }}"
          - "Action: copy .env.example to .env in each service's runtime directory,"
          - "        fill in the secret values, and re-run this playbook."
      when: held_back | length > 0

    - name: Fail if any service failed to deploy
      ansible.builtin.fail:
        msg: >-
          These services failed to deploy:
          {{ deploy_results.results | selectattr('failed', 'defined') | selectattr('failed') | map(attribute='item') | list }}.
          Every other service was deployed. Re-run after fixing them.
      when: >-
        deploy_results.results | default([]) | selectattr('failed', 'defined') | selectattr('failed') | list | length > 0
