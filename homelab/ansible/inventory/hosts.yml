---
# Single-host inventory for the homelab.
# Ansible runs against localhost via `connection: local` so no SSH involved —
# the playbook is expected to run on the homeserver itself (or via the docker
# wrapper that bind-mounts /home/mike and /var/run/docker.sock).

all:
  hosts:
    mchomeserver:
      ansible_connection: local
      ansible_host: 127.0.0.1
      # Ubuntu 26.04 makes /usr/bin/sudo the Rust sudo-rs, which wraps a custom
      # -p prompt as "[sudo: <prompt>] Password:". Ansible waits for its exact
      # prompt, never sees it, and times out ("Timed out waiting for become
      # success or become password prompt"). sudo.ws is the original sudo, still
      # shipped alongside, and honours -p as given.
      ansible_become_exe: sudo.ws
