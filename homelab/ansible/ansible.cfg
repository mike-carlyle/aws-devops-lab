[defaults]
inventory = inventory/hosts.yml
host_key_checking = False
stdout_callback = default
result_format = yaml
retry_files_enabled = False
nocows = True
# Facts are read only through ansible_facts[...]. ansible-core 2.24 drops the
# injected top-level ansible_* fact variables; turning injection off now makes
# any reintroduced old-style reference fail immediately instead of at upgrade.
inject_facts_as_vars = False
interpreter_python = auto_silent
forks = 1

[ssh_connection]
pipelining = True
