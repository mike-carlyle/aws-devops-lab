---
- name: Reload sysctl settings
  ansible.builtin.command:
    cmd: sysctl --system
  changed_when: true

# Deliberately NOT notified by the drop-in template. Whether resolved needs
# restarting depends on how the daemon is RUNNING, never on whether a file changed —
# see the comment on the probe task in tasks/main.yml.
- name: Restart systemd-resolved
  ansible.builtin.systemd_service:
    name: systemd-resolved
    state: restarted
