---
# Install Docker Engine (Docker CE) from Docker's official apt repository plus
# the Compose v2 plugin, and make the admin user able to talk to the daemon.
# Idempotent: re-running on a working box changes nothing.
#
# Uses the upstream docker-ce packages (not Ubuntu's docker.io) so the engine
# and the `docker compose` plugin track Docker's own releases.

- name: Install prerequisites for the Docker apt repository
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
    state: present
    update_cache: true

- name: Ensure /etc/apt/keyrings exists
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Add Docker's official GPG key
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    owner: root
    group: root
    mode: "0644"

# deb822 format since the 2026-10-01 upgrade to 26.04. do-release-upgrade
# disables one-line .list files it cannot migrate, so the live host now uses
# /etc/apt/sources.list.d/docker.sources -- the same file this task writes.
# The old one-line apt_repository task would have added a duplicate docker.list.
- name: Add the Docker CE apt repository
  ansible.builtin.deb822_repository:
    name: docker
    types: deb
    uris: https://download.docker.com/linux/ubuntu
    suites: "{{ ansible_distribution_release }}"
    components: stable
    architectures: "{{ 'amd64' if ansible_architecture in ['x86_64', 'amd64'] else 'arm64' }}"
    signed_by: /etc/apt/keyrings/docker.asc
    state: present

- name: Refresh the apt cache after adding the Docker repository
  ansible.builtin.apt:
    update_cache: true

- name: Install Docker CE engine, CLI, containerd, buildx and the compose plugin
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present

- name: Ensure docker service is enabled and running
  ansible.builtin.systemd:
    name: docker
    enabled: true
    state: started

- name: Ensure admin user is in the docker group
  ansible.builtin.user:
    name: "{{ admin_user }}"
    groups: docker
    append: true

- name: Set system-wide docker daemon log limits (rotate before disks fill)
  ansible.builtin.copy:
    dest: /etc/docker/daemon.json
    owner: root
    group: root
    mode: "0644"
    content: |
      {
        "log-driver": "json-file",
        "log-opts": {
          "max-size": "10m",
          "max-file": "3"
        }
      }
  notify: Reload docker daemon

- name: Confirm docker engine + compose plugin respond
  ansible.builtin.command: "{{ item }}"
  changed_when: false
  loop:
    - docker --version
    - docker compose version
